<!doctype html>
<html lang="en" class="zen-mareka-customer-site">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/assets/zen-logo.png" />
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/assets/fonts/MAREKA-ZenCafe-Letters.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('zen-cafe-theme');
          const theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="theme-color" content="#f8f0e8" />
    <meta name="description" content="Zen Café — premium one-page café experience in Jaffna with animated menu, private room booking and community gallery." />
<title>ZEN CAFÉ — Premium One Page</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
